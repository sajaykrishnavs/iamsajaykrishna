  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #00c6ff, #0072ff);
      background-size: 400% 400%;
      animation: gradientBG 25s ease infinite;
      min-height: 100vh;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Header */
    .wall-header {
      position: sticky;
      top: 0;
      z-index: 10;
      backdrop-filter: blur(10px);
      background: rgba(0,0,0,0.25);
    }

    h1 {
      color: #fff;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
      font-weight: 600;
    }

    /* Social Cards */
    .social-card {
      background: rgba(255,255,255,0.9);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      opacity: 0;
      transform: translateY(80px);
      transition: all 1.8s ease;
    }

    .social-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .social-card:hover {
      transform: scale(1.03);
      box-shadow: 0 30px 60px rgba(0,0,0,0.35);
    }

    iframe {
      border-radius: 14px;
      width: 100% !important;
    }

    /* Alignment */
    @media (min-width: 992px) {
      .left-card { margin-right: auto; }
      .right-card { margin-left: auto; }
    }

    /* Footer End */
    .end-card {
      background: linear-gradient(135deg, #007d9c, #00b4d8);
      color: #fff;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>

<script>
  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.2 });

  document.querySelectorAll('.social-card').forEach(card => {
    observer.observe(card);
  });
</script>



<script>
  fetch("https://api.github.com/repos/sajaykrishnavs/iamsajaykrishna/releases/latest")
    .then(res => res.json())
    .then(data => {

      const prefix = "01SRI-P/G";
      const githubId = data.id || "N/A";
      const combinedId = `${prefix}-${githubId}`;
      document.getElementById("custom_id").textContent = "  " + combinedId;
      // Set version tag
      document.getElementById("version").textContent = "Version: " + data.tag_name;

      // Convert published_at to IST
      const publishedDate = new Date(data.published_at);
      const formattedDate = publishedDate.toLocaleString("en-IN", {
        timeZone: "Asia/Kolkata",
        year: "numeric",
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      });

      document.getElementById("created_at").textContent = formattedDate;
    })
    .catch(err => {
      console.error("Failed to fetch version:", err);
      document.getElementById("version").textContent = "Version: N/A";
      document.getElementById("created_at").textContent = "N/A";
    });
</script>
